<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1720">
<title>The Lantern & Thorn · Playtest</title>
<link rel="icon" href="index.icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17131a;color:#edf0df;font:16px/1.5 system-ui}body{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 12%,#59402d,#17131a 75%)}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#17131a80,#17131ae8),url(preview.png) center/contain no-repeat;filter:blur(6px);opacity:.5;pointer-events:none}main{position:relative;width:min(100%,380px);padding:32px 26px;border:1px solid #89977c66;border-radius:12px;background:#1d1923f5;box-shadow:0 20px 90px #0008}.eyebrow{color:#c4ac76;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{font:32px/1.12 Georgia,serif;color:#e4cb91;margin:14px 0}p{color:#b9c8b1;font-size:14px}label{display:block;font-size:13px;margin:28px 0 8px}input{width:100%;padding:13px 12px;border:1px solid #7c8c75;border-radius:5px;background:#0b1b16;color:#fff;font:18px system-ui;outline-offset:3px}button{margin-top:14px;width:100%;padding:12px;border:1px solid #c4ac76;border-radius:5px;background:#bfa371;color:#1c1720;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-bottom:0;color:#e5b9a0;font-size:13px}iframe{position:fixed;inset:0;width:100%;height:100svh;border:0;background:#17131a}
</style>
</head>
<body>
<main id="gate">
<div class="eyebrow">A fantasy RPG · Prologue</div>
<h1>The Lantern & Thorn</h1>
<p>Three strangers. One missing courier. A road none of them should walk alone.</p>
<form id="access">
<label for="passcode">Playtest passcode</label>
<input id="passcode" type="password" autocomplete="current-password" required aria-describedby="status">
<button id="play" type="submit">Enter the demo</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main>
<script>
const PLAYTEST_PASSCODE = 'azamplays';
const storageKey = 'game-workbench-demo-access';
function unlock(){document.querySelector('#gate').remove();const frame=document.createElement('iframe');frame.title='The Lantern & Thorn, playable RPG demo';frame.src='game.html'+location.search+location.hash;frame.allow='autoplay; fullscreen; gamepad';frame.allowFullscreen=true;document.body.append(frame);try{sessionStorage.setItem(storageKey,PLAYTEST_PASSCODE)}catch{}}
let remembered=false;try{remembered=sessionStorage.getItem(storageKey)===PLAYTEST_PASSCODE}catch{}if(remembered)unlock();
document.querySelector('#access')?.addEventListener('submit',event=>{event.preventDefault();const status=document.querySelector('#status');if(document.querySelector('#passcode').value===PLAYTEST_PASSCODE){unlock()}else{status.textContent='That passcode didn’t match. Try again.';document.querySelector('#passcode').focus()}});
</script>
</body>
</html>
