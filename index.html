<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13241f">
<title>The Sky Courtyard · Playtest</title>
<link rel="icon" href="index.icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d1815;color:#edf0df;font:16px/1.5 system-ui}body{min-height:100svh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 12%,#304b40,#0d1815 75%)}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#0d181580,#0d1815e8),url(preview.png) center/contain no-repeat;filter:blur(6px);opacity:.5;pointer-events:none}main{position:relative;width:min(100%,380px);padding:32px 26px;border:1px solid #89977c66;border-radius:12px;background:#12271ff5;box-shadow:0 20px 90px #0008}.eyebrow{color:#c4ac76;font-size:11px;letter-spacing:.16em;text-transform:uppercase}h1{font:32px/1.12 Georgia,serif;color:#e4cb91;margin:14px 0}p{color:#b9c8b1;font-size:14px}label{display:block;font-size:13px;margin:28px 0 8px}input{width:100%;padding:13px 12px;border:1px solid #7c8c75;border-radius:5px;background:#0b1b16;color:#fff;font:18px system-ui;outline-offset:3px}button{margin-top:14px;width:100%;padding:12px;border:1px solid #c4ac76;border-radius:5px;background:#bfa371;color:#13241f;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-bottom:0;color:#e5b9a0;font-size:13px}iframe{position:fixed;inset:0;width:100%;height:100svh;border:0;background:#0d1815}
</style>
</head>
<body>
<main id="gate">
<div class="eyebrow">Game Workbench · Early playtest</div>
<h1>The Sky Courtyard</h1>
<p>A small party, a bridge through the clouds, and the beginnings of an RPG.</p>
<form id="access">
<label for="passcode">Playtest passcode</label>
<input id="passcode" type="password" autocomplete="current-password" required aria-describedby="status">
<button id="play" type="submit">Enter the demo</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
</main>
<script>
const salt='0c3167ea4ee8a744431cd77e8495f66f',verifier='02e2686193701e4e08f1d1d6e1f0f2c09ad0f0a9afa5054c914229254915f7dd',iterations=210000,storageKey='game-workbench-demo-access';
function unlock(){document.querySelector('#gate').remove();const frame=document.createElement('iframe');frame.title='The Sky Courtyard, playable RPG demo';frame.src='game.html'+location.search+location.hash;frame.allow='autoplay; fullscreen; gamepad';frame.allowFullscreen=true;document.body.append(frame);try{sessionStorage.setItem(storageKey,verifier)}catch{}}
let remembered=false;try{remembered=sessionStorage.getItem(storageKey)===verifier}catch{}if(remembered)unlock();
document.querySelector('#access')?.addEventListener('submit',async event=>{event.preventDefault();const button=document.querySelector('#play'),status=document.querySelector('#status');button.disabled=true;status.textContent='Checking passcode…';try{if(!crypto.subtle)throw Error('Open this page over HTTPS in a current browser.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.querySelector('#passcode').value),'PBKDF2',false,['deriveBits']);const bytes=Uint8Array.from(salt.match(/../g),part=>parseInt(part,16));const result=await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes,iterations,hash:'SHA-256'},key,256);const actual=Array.from(new Uint8Array(result),byte=>byte.toString(16).padStart(2,'0')).join('');let mismatch=0;for(let i=0;i<verifier.length;i++)mismatch|=actual.charCodeAt(i)^verifier.charCodeAt(i);if(mismatch){status.textContent='That passcode didn’t match. Try again.';document.querySelector('#passcode').focus()}else unlock()}catch(error){status.textContent=error.message||'Please try again in a current browser.'}finally{if(document.body.contains(button))button.disabled=false}});
</script>
</body>
</html>
